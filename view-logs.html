<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Logs - Admin</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    
    <!-- Core styles -->
    <link rel="stylesheet" href="src/styles/view-logs.css">
    
    <style>
        /* Critical inline styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif; }
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        #mainContent { display: none; }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .login-box h2 {
            margin-bottom: 30px;
            color: #1a1a2e;
            text-align: center;
            font-weight: 600;
        }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .login-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .login-box button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .login-error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen">
        <form id="loginForm" class="login-box">
            <h2>Location Logs</h2>
            <div id="loginError" class="login-error"></div>
            <input type="email" id="email" placeholder="Email" required autocomplete="email">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" id="loginButton">Login</button>
        </form>
    </div>

    <!-- Main Content -->
    <div id="mainContent">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="header-title">Location Logs</h1>
                <span id="versionDisplay" class="version-tag"></span>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="refreshDataBtn">
                    <span class="btn-icon">Refresh</span>
                </button>
                <label class="auto-refresh-toggle">
                    <input type="checkbox" id="autoRefresh">
                    <span>Auto</span>
                    <span id="refreshTimer" class="timer"></span>
                </label>
                <div class="theme-selector">
                    <label>Theme:</label>
                    <select id="themeSelect">
                        <option value="westpac">Westpac</option>
                        <option value="winz">Work and Income NZ</option>
                        <option value="ird">Inland Revenue</option>
                        <option value="acc">ACC</option>
                    </select>
                    <button class="btn btn-sm" id="previewThemeBtn" title="Preview">Preview</button>
                </div>
                <button class="btn btn-discord" id="testDiscordBtn" title="Test Discord">
                    <span class="btn-icon">Discord</span>
                </button>
                <button class="btn btn-danger" id="logoutButton">Logout</button>
            </div>
        </header>

        <!-- Error Banner -->
        <div id="errorMessage" class="error-banner"></div>

        <!-- Main Dashboard -->
        <main class="dashboard">
            <!-- Logs Panel -->
            <section class="panel logs-panel">
                <div class="panel-header">
                    <h2>Location Feed</h2>
                    <div class="panel-controls">
                        <div class="search-wrapper">
                            <input type="text" id="searchInput" placeholder="Search...">
                        </div>
                        <button class="btn btn-sm btn-export" id="exportCsvBtn">CSV</button>
                        <button class="btn btn-sm btn-export btn-json" id="exportJsonBtn">JSON</button>
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="firstName">User</th>
                                <th class="sortable" data-sort="timestamp">Time</th>
                                <th class="sortable" data-sort="ip">IP</th>
                                <th>Location</th>
                                <th class="sortable" data-sort="accuracy">Accuracy</th>
                                <th class="sortable" data-sort="locationSource">Source</th>
                                <th>Device</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="logsTable">
                            <tr class="loading-row">
                                <td colspan="8">
                                    <div class="loading-spinner"></div>
                                    <span>Loading locations...</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="panel-footer">
                    <span id="paginationInfo" class="pagination-info">Loading...</span>
                    <div id="paginationControls" class="pagination-controls"></div>
                </div>
            </section>

            <!-- Map Panel -->
            <section class="panel map-panel">
                <div class="panel-header">
                    <h2>Live Map</h2>
                    <span id="markerCount" class="marker-count"></span>
                </div>
                <div class="map-container">
                    <div id="locationMap"></div>
                    <div id="mapLoading" class="map-loading">
                        <div class="loading-spinner"></div>
                        <span>Loading map...</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- Toast -->
        <div id="toast" class="toast"></div>

        <!-- Theme Preview Modal -->
        <div id="themePreviewModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Theme Preview</h3>
                    <button id="closePreviewBtn" class="modal-close">X</button>
                </div>
                <iframe id="themePreviewFrame" class="preview-frame"></iframe>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="src/core/firebase-config.js"></script>
    <script type="module" src="src/core/firebase-init.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <!-- Themes config -->
    <script src="themes/config.js"></script>

    <!-- Main App -->
    <script type="module" src="view-logs-new.js"></script>
</body>
</html>
